name: Android CI and Release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, unit tests, and debug compile
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compile debug APK
        run: ./gradlew --no-daemon assembleDebug

  release:
    name: Build and publish signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/orchit-release.jks"

      - name: Validate tag and set Android version
        run: |
          tag="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]')"
          case "$tag" in
            v0.*-alpha*) ;;
            v0.9.*-beta*) ;;
            v1.0.0) ;;
            *) echo "Use alpha v0.x-alpha, beta v0.9.x-beta, or final v1.0.0 tags." >&2; exit 1 ;;
          esac
          version_name="$(printf '%s' "$GITHUB_REF_NAME" | cut -c 2-)"
          printf 'ORCHIT_VERSION_NAME=%s\n' "$version_name" >> "$GITHUB_ENV"
          printf 'ORCHIT_VERSION_CODE=%s\n' "$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/orchit-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          ./gradlew --no-daemon assembleRelease

      - name: Publish APK on GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: Samvid-OpenSource/Orchit
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          case "$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]')" in
            *alpha*|*beta*)
              gh release create "$GITHUB_REF_NAME" "$apk" --title "$GITHUB_REF_NAME" --generate-notes --prerelease
              ;;
            *)
              gh release create "$GITHUB_REF_NAME" "$apk" --title "$GITHUB_REF_NAME" --generate-notes
              ;;
          esac
